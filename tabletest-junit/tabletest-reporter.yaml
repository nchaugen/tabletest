# Report-time curation for the core (tabletest-junit) living spec.
#
# Spec metadata (title, intro, feature titles) and publish selection are both applied when
# the report is generated, not when the tests run. Nothing here is a test-code concern, and
# nothing here is JVM-specific — the second (non-JVM) implementation ships the same file.
# See the reporter decisions spec-metadata-sidecar-file and publish-selection-at-report-time.

# --- Spec metadata --------------------------------------------------------------------
# Without this section the root index is titled by the deepest common package segment
# ("junit") and each feature page by its lowercase package name ("converting", "features",
# "examples", "builtin"). Feature titles come from the Feature map in the living-docs-coverage
# roadmap; declared features lead in the order given, undeclared siblings follow alphabetically.
title: "TableTest JUnit"
intro: >
  How a TableTest table becomes test scenarios: what each cell value is converted to, what the
  table syntax means to the test runner, and what the whole thing looks like in use. Every rule
  below is executable — it is a test that runs in CI, and each scenario is one row of that
  test's table. The table format's own grammar is specified separately, by TableTest Parser.
features:
  - name: converting
    title: "Value conversion"
    features:
      - name: builtin
        title: "Built-in conversion"
        # The four undeclared siblings keep their alphabetical place; datetime is declared
        # only to hold its own reading order, so all five are listed to preserve it.
        features:
          - name: characters-booleans-and-enums
          - name: datetime
            title: "Dates and times"
            features:
              - name: dates-and-times-without-an-offset
              - name: instants-offsets-and-zones
              - name: amounts-of-time
          - name: files-and-addresses
          - name: numbers
          - name: platform-value-types
      - name: collections
        title: "Collections and arrays"
      - name: custom
        title: "Custom converters"
  - name: features
    title: "Table semantics"
  - name: examples
    title: "Worked examples"

# --- Site link ------------------------------------------------------------------------
# The spec is published under tabletest.org/spec/junit, where every link inside the
# report is relative to the report's own tree. This is the one link back out to the site.
site:
  label: "TableTest"
  url: "https://tabletest.org/"

# --- Publish selection ----------------------------------------------------------------
publish:
  exclude:
    # --- Kotlin twins: one language publishes; Kotlin mirrors the Java suite ---
    - converting/collections/kotlin-array-parameter-conversion-test
    - converting/collections/kotlin-immutable-collection-parameters-test
    - converting/collections/kotlin-parameterized-type-conversion-test
    - converting/custom/kotlin-convert-with-test
    - converting/custom/kotlin-factory-method-in-test-class-conversion-test
    - converting/custom/kotlin-fallback-conversion-test
    - converting/custom/kotlin-type-converter-sources-test
    - converting/kotlin-conversion-failure-test
    - converting/kotlin-primitive-conversion-test
    - examples/kotlin-student-grades-example-test
    - features/kotlin-comments-and-blank-lines-test
    - features/kotlin-external-table-test
    - features/kotlin-null-value-test
    - features/kotlin-parameter-resolvers-test
    - features/kotlin-scenario-name-test
    - features/kotlin-value-set-test

    # --- Converter-mechanism rules whose meaning lives in converter code the
    #     report cannot show; stay conformance ---
    - converting/custom/java-convert-with-test
    - converting/custom/java-factory-method-in-test-class-conversion-test
    - converting/custom/java-type-converter-selection-test
    - converting/custom/java-type-converter-sources-test
    - converting/conversion-failures/fails-when-multiple-type-converters-found  # one row: ambiguous converter selection

    # --- Duplicates a rule the parser's own grammar spec (/spec/parser) already states ---
    - parsing

    # --- Deprecated annotations exercised for back-compat, not a current rule ---
    - deprecated

    # --- Internal mechanism (parameter-type analysis), not a user-facing rule ---
    - parameter-type-analyzer-test

    # --- Permanent duplicate: parser's published "blank lines and whole-line
    #     comments are ignored" rule (TableStructureTest) already states this;
    #     demonstrated self-referentially here, which no reporter capability can show ---
    - features/java-comments-and-blank-lines-test

    # --- The array form of a table: its elements are joined with a newline, and a
    #     published table shows the rows it produced, never the source it was written
    #     from. A rule that joined the lines in its own body would restate the one
    #     production line (TableArgumentsProvider) and verify nothing, so this stays
    #     conformance. Not a reporter gap: @Lines renders a data value, and the array
    #     form is source. The parser's own Table structure rules already publish what
    #     an empty line and a comment line mean. Reviewed 2026-08-27 ---
    - features/java-table-as-string-array-test

    # --- Rows that render nothing they demonstrate, or duplicate/implementation
    #     detail within an otherwise published class ---
    - examples/value-formats/comment-lines-annotate-or-disable-rows  # comment lines don't reach the report
    - features/external-table-files/table-in-external-file-in-explicit-root  # duplicate of implicit-root, only a leading slash differs
    - features/scenario-names/declared-scenario-name-becomes-display-name    # asserts JUnit's internal [n]-prefixed names
    - features/scenario-names/declared-scenario-name-do-not-have-to-be-first-parameter  # ditto: implementation detail, not spec
